#Goal: To scan the built docker image for vulnerabilities using trivy scanner
name: Image Scan
on:
  workflow_call: # allows this workflow to be called from another workflow 
jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Docker setup
        uses: docker/setup-docker-action@v5
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up qemu
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
         push: false
         tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-tws-github-actions:latest 
         load: true
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-tws-github-actions:latest
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'